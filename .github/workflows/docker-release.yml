name: Build and Push Docker Image

on:
  release:
    types: [published]
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        type: string
        default: dev
      environment:
        description: 'GitHub environment name'
        required: true
        type: string

env:
  REGISTRY_NAME: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.service.name }} - ${{ matrix.platform }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && vars.DEV_PUSH_ENVIRONMENT
      || github.event_name == 'release' && vars.RELEASE_ENVIRONMENT
      || github.event.inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: background-job
            image_suffix: raffle-background-job
            service_dir: ./services/background-job
            description: Docker image for the background-job owned by ErgoRaffle organization.
          - name: api
            image_suffix: raffle-api
            service_dir: ./services/api
            description: Docker image for the api owned by ErgoRaffle organization.
          - name: btc-payment
            image_suffix: raffle-btc-payment
            service_dir: ./services/btc-payment
            description: Docker image for the btc-payment owned by ErgoRaffle organization.
        platform: ${{ fromJSON(vars.PLATFORM_LIST || '["linux/amd64"]') }}

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - name: Download tokens.json
        if: matrix.service.name == 'btc-payment'
        working-directory: ${{ matrix.service.service_dir }}
        shell: bash
        run: |
          mkdir -p ./config
          npx @rosen-bridge/cli@${{ vars.ROSEN_CLI_VERSION || 'latest' }} download-assets -c ${{ vars.RELEASE_NAME }} ${{ vars.RELEASE_TAG }} -o ./config 
          mv ./config/tokens*.json ./config/tokenMap.json

      - name: Move Docker YAMLs
        working-directory: ${{ matrix.service.service_dir }}
        shell: bash
        run: |
          mv ./docker/*.yaml ./config/

      - name: Set up QEMU
        if: contains(matrix.platform, 'arm')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for artifact
        shell: bash
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Generate Docker Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_NAME }}/${{ matrix.service.image_suffix }}

      - name: Build and push by digest
        env:
          IMAGE_NAME: ${{ env.REGISTRY_NAME }}/${{ matrix.service.image_suffix }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.service_dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest file
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/digests/${{ matrix.service.name }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.service.name }}/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/${{ matrix.service.name }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-arch Manifest - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: background-job
            image_suffix: raffle-background-job
            description: Docker image for the background-job owned by ErgoRaffle organization.
          - name: api
            image_suffix: raffle-api
            description: Docker image for the api owned by ErgoRaffle organization.
          - name: btc-payment
            image_suffix: raffle-btc-payment
            description: Docker image for the btc-payment owned by ErgoRaffle organization.

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag for workflow_dispatch
        id: set-tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          branch="${{ github.event.inputs.branch }}"
          branch="${branch//\//-}"
          echo "tag=${branch}-${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker Metadata
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_NAME }}/${{ matrix.service.image_suffix }}
          tags: |
            type=match,pattern=\d+\.\d+\.\d+,enable=${{ github.event_name == 'release' }}
            type=raw,value=dev,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.set-tag.outputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Login to GHCR Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.REGISTRY_NAME }}/${{ matrix.service.image_suffix }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${{ matrix.service.description }}" \
            $(printf ' -t %s' $TAGS) \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
