logs:
  - type: console
    level: info
  - type: file
    level: info
    path: ./logs/
    maxSize: 20m
    maxFiles: 14d
database:
  type: postgres
  host: localhost
  port: 5432
  username: postgres
  password: ''
  name: raffle_v2
scanner:
  node:
    url: http://127.0.0.1:9052/
    timeout: 10
  scannerInterval: 30
txpot:
  updateInterval: 60
  txRequiredConfirmations: 5
ergo:
  fee: 1500000
healthCheck:
  updateInterval: 60
  warnBlockGap: 2
  criticalBlockGap: 10
boxLookup:
  updateInterval: 60
tokenDetails:
  updateInterval: 60
verifiedTokenIds: []
