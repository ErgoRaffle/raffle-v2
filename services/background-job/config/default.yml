logs:
  - type: console
    level: info
  - type: file
    level: info
    path: ./logs/
    maxSize: 20m
    maxFiles: 14d
database:
  type: postgres
  host: localhost
  port: 5432
  username: postgres
  password: ''
  name: raffle_v2_background_job
scanner:
  node:
    url: http://127.0.0.1:9052/
    timeout: 10
  scannerInterval: 30
txpot:
  updateInterval: 60
  txRequiredConfirmations: 5
ergo:
  fee: 1500000
  network: mainnet
healthCheck:
  updateInterval: 60
  warnBlockGap: 2
  criticalBlockGap: 10
boxLookup:
  updateInterval: 60
api:
  port: 3000
  swaggerPath: /swagger
  title: Ergo Raffle API
  description: API for Ergo Raffle operations
